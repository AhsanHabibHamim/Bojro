name: bojro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bojro}
      POSTGRES_USER: ${POSTGRES_USER:-bojro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-only-change-me-at-least-32-characters}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-jwt-secret-change-me-at-least-32-characters}
      ADMIN_JWT_SECRET_KEY: ${ADMIN_JWT_SECRET_KEY:-local-admin-jwt-secret-change-me-at-least-32-characters}
      GUEST_IDENTITY_SECRET: ${GUEST_IDENTITY_SECRET:-local-guest-secret-change-me-at-least-32-characters}
      QUOTE_TOKEN_SECRET: ${QUOTE_TOKEN_SECRET:-local-quote-secret-change-me-at-least-32-characters}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-local-otp-secret-change-me-at-least-32-characters}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      OTP_MOCK_CODE: ${OTP_MOCK_CODE:-123456}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_TOTP_ENCRYPTION_KEY: ${ADMIN_TOTP_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ADMIN_TOTP_KEYRING: '${ADMIN_TOTP_KEYRING:-{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}}'
      ADMIN_TOTP_REQUIRED: ${ADMIN_TOTP_REQUIRED:-false}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-mock}
      STORAGE_MOCK_SECRET: ${STORAGE_MOCK_SECRET:-local-storage-mock-secret-change-me-32-characters}
      COURIER_PROVIDER: ${COURIER_PROVIDER:-mock}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      PUBLIC_STOREFRONT_BASE_URL: ${PUBLIC_STOREFRONT_BASE_URL:-http://localhost:3000}
      BKASH_MODE: ${BKASH_MODE:-mock}
      NAGAD_MODE: ${NAGAD_MODE:-mock}
      SSLCOMMERZ_MODE: ${SSLCOMMERZ_MODE:-mock}
      PATHAO_MODE: ${PATHAO_MODE:-mock}
      STEADFAST_MODE: ${STEADFAST_MODE:-mock}
      REDX_MODE: ${REDX_MODE:-mock}
      PROVIDER_MOCK_SIGNING_SECRET: ${PROVIDER_MOCK_SIGNING_SECRET:-local-provider-mock-signing-secret-32-characters}
      PHASE6_E2E_RESET_TOKEN: ${PHASE6_E2E_RESET_TOKEN:-local-phase6-e2e-reset-token}
      PHASE7_E2E_RESET_TOKEN: ${PHASE7_E2E_RESET_TOKEN:-local-phase7-e2e-reset-token}
      ENGAGEMENT_PII_KEYRING: '${ENGAGEMENT_PII_KEYRING:-{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}}'
      ENGAGEMENT_PII_ACTIVE_KEY_ID: ${ENGAGEMENT_PII_ACTIVE_KEY_ID:-v1}
      ENGAGEMENT_LOOKUP_HMAC_KEYRING: '${ENGAGEMENT_LOOKUP_HMAC_KEYRING:-{"v1":"local-engagement-lookup-hmac-key-32-characters"}}'
      ENGAGEMENT_LOOKUP_HMAC_ACTIVE_KEY_ID: ${ENGAGEMENT_LOOKUP_HMAC_ACTIVE_KEY_ID:-v1}
      UNSUBSCRIBE_SIGNING_KEYRING: '${UNSUBSCRIBE_SIGNING_KEYRING:-{"v1":"local-unsubscribe-signing-key-32-characters"}}'
      UNSUBSCRIBE_SIGNING_ACTIVE_KEY_ID: ${UNSUBSCRIBE_SIGNING_ACTIVE_KEY_ID:-v1}
      CONSENT_POLICY_VERSION: ${CONSENT_POLICY_VERSION:-2026-11-07-v1}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      META_CAPI_MODE: ${META_CAPI_MODE:-mock}
      META_PIXEL_ID: ${META_PIXEL_ID:-123456789012345}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-G-E2EBOJRO}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-mock}
      ASSISTANT_PUBLIC_ENABLED: ${ASSISTANT_PUBLIC_ENABLED:-true}
      ASSISTANT_ZERO_RETENTION_APPROVED: ${ASSISTANT_ZERO_RETENTION_APPROVED:-true}
      ASSISTANT_DPA_APPROVED: ${ASSISTANT_DPA_APPROVED:-true}
      NEWSLETTER_ENABLED: ${NEWSLETTER_ENABLED:-true}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-+8801700000000}
      PHASE7_E2E_ENABLED: ${PHASE7_E2E_ENABLED:-true}
      REVALIDATION_URL: ${REVALIDATION_URL:-http://frontend:3000/api/revalidate}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-local-only-change-me-revalidation-secret}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bojro}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-bojro}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["${FRONTEND_ORIGIN:-http://localhost:3000}"]'
      TRUSTED_HOSTS: '["localhost","127.0.0.1","backend"]'
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command: >-
      sh -c ".venv/bin/alembic -c alembic.ini upgrade head &&
      .venv/bin/python scripts/seed.py &&
      exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-only-change-me-at-least-32-characters}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-jwt-secret-change-me-at-least-32-characters}
      ADMIN_JWT_SECRET_KEY: ${ADMIN_JWT_SECRET_KEY:-local-admin-jwt-secret-change-me-at-least-32-characters}
      GUEST_IDENTITY_SECRET: ${GUEST_IDENTITY_SECRET:-local-guest-secret-change-me-at-least-32-characters}
      QUOTE_TOKEN_SECRET: ${QUOTE_TOKEN_SECRET:-local-quote-secret-change-me-at-least-32-characters}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-local-otp-secret-change-me-at-least-32-characters}
      ADMIN_TOTP_ENCRYPTION_KEY: ${ADMIN_TOTP_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ADMIN_TOTP_KEYRING: '${ADMIN_TOTP_KEYRING:-{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}}'
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bojro}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-bojro}
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-mock}
      STORAGE_MOCK_SECRET: ${STORAGE_MOCK_SECRET:-local-storage-mock-secret-change-me-32-characters}
      COURIER_PROVIDER: ${COURIER_PROVIDER:-mock}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      PUBLIC_STOREFRONT_BASE_URL: ${PUBLIC_STOREFRONT_BASE_URL:-http://localhost:3000}
      BKASH_MODE: ${BKASH_MODE:-mock}
      NAGAD_MODE: ${NAGAD_MODE:-mock}
      SSLCOMMERZ_MODE: ${SSLCOMMERZ_MODE:-mock}
      PATHAO_MODE: ${PATHAO_MODE:-mock}
      STEADFAST_MODE: ${STEADFAST_MODE:-mock}
      REDX_MODE: ${REDX_MODE:-mock}
      PROVIDER_MOCK_SIGNING_SECRET: ${PROVIDER_MOCK_SIGNING_SECRET:-local-provider-mock-signing-secret-32-characters}
      PHASE6_E2E_RESET_TOKEN: ${PHASE6_E2E_RESET_TOKEN:-local-phase6-e2e-reset-token}
      PHASE7_E2E_RESET_TOKEN: ${PHASE7_E2E_RESET_TOKEN:-local-phase7-e2e-reset-token}
      ENGAGEMENT_PII_KEYRING: '${ENGAGEMENT_PII_KEYRING:-{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}}'
      ENGAGEMENT_PII_ACTIVE_KEY_ID: ${ENGAGEMENT_PII_ACTIVE_KEY_ID:-v1}
      ENGAGEMENT_LOOKUP_HMAC_KEYRING: '${ENGAGEMENT_LOOKUP_HMAC_KEYRING:-{"v1":"local-engagement-lookup-hmac-key-32-characters"}}'
      ENGAGEMENT_LOOKUP_HMAC_ACTIVE_KEY_ID: ${ENGAGEMENT_LOOKUP_HMAC_ACTIVE_KEY_ID:-v1}
      UNSUBSCRIBE_SIGNING_KEYRING: '${UNSUBSCRIBE_SIGNING_KEYRING:-{"v1":"local-unsubscribe-signing-key-32-characters"}}'
      UNSUBSCRIBE_SIGNING_ACTIVE_KEY_ID: ${UNSUBSCRIBE_SIGNING_ACTIVE_KEY_ID:-v1}
      CONSENT_POLICY_VERSION: ${CONSENT_POLICY_VERSION:-2026-11-07-v1}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      META_CAPI_MODE: ${META_CAPI_MODE:-mock}
      META_PIXEL_ID: ${META_PIXEL_ID:-123456789012345}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-G-E2EBOJRO}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-mock}
      ASSISTANT_PUBLIC_ENABLED: ${ASSISTANT_PUBLIC_ENABLED:-true}
      ASSISTANT_ZERO_RETENTION_APPROVED: ${ASSISTANT_ZERO_RETENTION_APPROVED:-true}
      ASSISTANT_DPA_APPROVED: ${ASSISTANT_DPA_APPROVED:-true}
      NEWSLETTER_ENABLED: ${NEWSLETTER_ENABLED:-true}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-+8801700000000}
      PHASE7_E2E_ENABLED: ${PHASE7_E2E_ENABLED:-true}
      REVALIDATION_URL: ${REVALIDATION_URL:-http://frontend:3000/api/revalidate}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-local-only-change-me-revalidation-secret}
    command: [".venv/bin/arq", "app.workers.review_photos.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_E2E_STORAGE_MOCK: ${NEXT_PUBLIC_E2E_STORAGE_MOCK:-1}
        NEXT_PUBLIC_E2E_PROVIDER_MOCK: ${NEXT_PUBLIC_E2E_PROVIDER_MOCK:-1}
        NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK: ${NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK:-1}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: http://backend:8000
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-local-only-change-me-revalidation-secret}
      NEXT_PUBLIC_E2E_STORAGE_MOCK: ${NEXT_PUBLIC_E2E_STORAGE_MOCK:-1}
      NEXT_PUBLIC_E2E_PROVIDER_MOCK: ${NEXT_PUBLIC_E2E_PROVIDER_MOCK:-1}
      NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK: ${NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK:-1}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/bn"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
