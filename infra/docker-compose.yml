name: bojro

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-local-only-change-me-at-least-32-characters}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-jwt-secret-change-me-at-least-32-characters}
  ADMIN_JWT_SECRET_KEY: ${ADMIN_JWT_SECRET_KEY:-local-admin-jwt-secret-change-me-at-least-32-characters}
  GUEST_IDENTITY_SECRET: ${GUEST_IDENTITY_SECRET:-local-guest-secret-change-me-at-least-32-characters}
  QUOTE_TOKEN_SECRET: ${QUOTE_TOKEN_SECRET:-local-quote-secret-change-me-at-least-32-characters}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-local-otp-secret-change-me-at-least-32-characters}
  OTP_MOCK_CODE: ${OTP_MOCK_CODE:-123456}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
  ADMIN_TOTP_ENCRYPTION_KEY: ${ADMIN_TOTP_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  ADMIN_TOTP_ACTIVE_KEY_ID: ${ADMIN_TOTP_ACTIVE_KEY_ID:-v1}
  ADMIN_TOTP_KEYRING: '${ADMIN_TOTP_KEYRING:-{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}}'
  ADMIN_TOTP_REQUIRED: ${ADMIN_TOTP_REQUIRED:-false}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bojro}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-bojro}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-300}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
  DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
  DB_IDLE_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
  REDIS_URL: redis://redis:6379/0
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-mock}
  STORAGE_MOCK_SECRET: ${STORAGE_MOCK_SECRET:-local-storage-mock-secret-change-me-32-characters}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  COURIER_PROVIDER: ${COURIER_PROVIDER:-manual}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
  PUBLIC_STOREFRONT_BASE_URL: ${PUBLIC_STOREFRONT_BASE_URL:-http://localhost:3000}
  BKASH_MODE: ${BKASH_MODE:-disabled}
  BKASH_CONFIGURED: ${BKASH_CONFIGURED:-false}
  BKASH_DOCUMENTATION_VERIFIED: ${BKASH_DOCUMENTATION_VERIFIED:-false}
  NAGAD_MODE: ${NAGAD_MODE:-disabled}
  NAGAD_CONFIGURED: ${NAGAD_CONFIGURED:-false}
  NAGAD_DOCUMENTATION_VERIFIED: ${NAGAD_DOCUMENTATION_VERIFIED:-false}
  SSLCOMMERZ_MODE: ${SSLCOMMERZ_MODE:-disabled}
  SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
  SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
  PATHAO_MODE: ${PATHAO_MODE:-disabled}
  PATHAO_CONFIGURED: ${PATHAO_CONFIGURED:-false}
  PATHAO_DOCUMENTATION_VERIFIED: ${PATHAO_DOCUMENTATION_VERIFIED:-false}
  STEADFAST_MODE: ${STEADFAST_MODE:-disabled}
  STEADFAST_CONFIGURED: ${STEADFAST_CONFIGURED:-false}
  STEADFAST_DOCUMENTATION_VERIFIED: ${STEADFAST_DOCUMENTATION_VERIFIED:-false}
  REDX_MODE: ${REDX_MODE:-disabled}
  REDX_CONFIGURED: ${REDX_CONFIGURED:-false}
  REDX_DOCUMENTATION_VERIFIED: ${REDX_DOCUMENTATION_VERIFIED:-false}
  PROVIDER_MOCK_SIGNING_SECRET: ${PROVIDER_MOCK_SIGNING_SECRET:-local-provider-mock-signing-secret-32-characters}
  PHASE6_E2E_RESET_TOKEN: ${PHASE6_E2E_RESET_TOKEN:-}
  ENGAGEMENT_PII_KEYRING: '${ENGAGEMENT_PII_KEYRING:-{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}}'
  ENGAGEMENT_PII_ACTIVE_KEY_ID: ${ENGAGEMENT_PII_ACTIVE_KEY_ID:-v1}
  ENGAGEMENT_LOOKUP_HMAC_KEYRING: '${ENGAGEMENT_LOOKUP_HMAC_KEYRING:-{"v1":"local-engagement-lookup-hmac-key-32-characters"}}'
  ENGAGEMENT_LOOKUP_HMAC_ACTIVE_KEY_ID: ${ENGAGEMENT_LOOKUP_HMAC_ACTIVE_KEY_ID:-v1}
  UNSUBSCRIBE_SIGNING_KEYRING: '${UNSUBSCRIBE_SIGNING_KEYRING:-{"v1":"local-unsubscribe-signing-key-32-characters"}}'
  UNSUBSCRIBE_SIGNING_ACTIVE_KEY_ID: ${UNSUBSCRIBE_SIGNING_ACTIVE_KEY_ID:-v1}
  CONSENT_POLICY_VERSION: ${CONSENT_POLICY_VERSION:-2026-11-07-v1}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
  EMAIL_FROM: "${EMAIL_FROM:-Bojro <no-reply@bojro.test>}"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-mock}
  SMS_ENDPOINT: ${SMS_ENDPOINT:-}
  SMS_API_KEY: ${SMS_API_KEY:-}
  SMS_CONFIGURED: ${SMS_CONFIGURED:-false}
  SMS_DOCUMENTATION_VERIFIED: ${SMS_DOCUMENTATION_VERIFIED:-false}
  SMS_PROVIDER_NAME: ${SMS_PROVIDER_NAME:-}
  SMS_DOCUMENTATION_URL: ${SMS_DOCUMENTATION_URL:-}
  SMS_DOCUMENTATION_VERSION: ${SMS_DOCUMENTATION_VERSION:-}
  SMS_SUPPORTS_IDEMPOTENCY: ${SMS_SUPPORTS_IDEMPOTENCY:-false}
  SMS_IDEMPOTENCY_HEADER: ${SMS_IDEMPOTENCY_HEADER:-Idempotency-Key}
  NOTIFICATION_CONTENT_RETENTION_DAYS: ${NOTIFICATION_CONTENT_RETENTION_DAYS:-30}
  NOTIFICATION_ATTEMPT_RETENTION_DAYS: ${NOTIFICATION_ATTEMPT_RETENTION_DAYS:-180}
  ENGAGEMENT_TEST_RECIPIENT_ALIASES: "${ENGAGEMENT_TEST_RECIPIENT_ALIASES:-{}}"
  META_CAPI_MODE: ${META_CAPI_MODE:-disabled}
  META_PIXEL_ID: ${META_PIXEL_ID:-}
  META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
  GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
  ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-disabled}
  ASSISTANT_ENDPOINT: ${ASSISTANT_ENDPOINT:-https://api.openai.com/v1/chat/completions}
  ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
  ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4.1-mini}
  ASSISTANT_PUBLIC_ENABLED: ${ASSISTANT_PUBLIC_ENABLED:-false}
  ASSISTANT_ZERO_RETENTION_APPROVED: ${ASSISTANT_ZERO_RETENTION_APPROVED:-false}
  ASSISTANT_DPA_APPROVED: ${ASSISTANT_DPA_APPROVED:-false}
  NEWSLETTER_ENABLED: ${NEWSLETTER_ENABLED:-true}
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
  WHATSAPP_PHONE: "${WHATSAPP_PHONE:-+8801700000000}"
  PHASE7_E2E_ENABLED: ${PHASE7_E2E_ENABLED:-false}
  PHASE7_E2E_RESET_TOKEN: ${PHASE7_E2E_RESET_TOKEN:-}
  REVALIDATION_URL: ${REVALIDATION_URL:-http://frontend:3000/api/revalidate}
  REVALIDATION_SECRET: ${REVALIDATION_SECRET:-local-only-change-me-revalidation-secret}
  WORKER_HEARTBEAT_KEY: ${WORKER_HEARTBEAT_KEY:-bojro:worker:heartbeat}
  WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-180}
  WORKER_HEARTBEAT_REQUIRED: ${WORKER_HEARTBEAT_REQUIRED:-false}
  READINESS_DIAGNOSTICS_TOKEN: ${READINESS_DIAGNOSTICS_TOKEN:-local-readiness-diagnostics-token-32-characters}
  RETENTION_CLEANUP_BATCH_SIZE: ${RETENTION_CLEANUP_BATCH_SIZE:-500}
  CORS_ORIGINS: '["${FRONTEND_ORIGIN:-http://localhost:3000}"]'
  TRUSTED_HOSTS: '["localhost","127.0.0.1","backend"]'
  TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-[]}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bojro}
      POSTGRES_USER: ${POSTGRES_USER:-bojro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      <<: *backend-environment
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command: >-
      sh -c ".venv/bin/alembic -c alembic.ini upgrade head &&
      .venv/bin/python scripts/seed.py &&
      exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --no-proxy-headers"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      <<: *backend-environment
    command: [".venv/bin/arq", "app.workers.review_photos.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_ERROR_REPORTING_ENDPOINT: ${NEXT_PUBLIC_ERROR_REPORTING_ENDPOINT:-}
        NEXT_PUBLIC_E2E_STORAGE_MOCK: ${NEXT_PUBLIC_E2E_STORAGE_MOCK:-0}
        NEXT_PUBLIC_E2E_PROVIDER_MOCK: ${NEXT_PUBLIC_E2E_PROVIDER_MOCK:-0}
        NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK: ${NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK:-0}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: http://backend:8000
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-local-only-change-me-revalidation-secret}
      NEXT_PUBLIC_ERROR_REPORTING_ENDPOINT: ${NEXT_PUBLIC_ERROR_REPORTING_ENDPOINT:-}
      ERROR_REPORTING_ENDPOINT: ${ERROR_REPORTING_ENDPOINT:-}
      NEXT_PUBLIC_E2E_STORAGE_MOCK: ${NEXT_PUBLIC_E2E_STORAGE_MOCK:-0}
      NEXT_PUBLIC_E2E_PROVIDER_MOCK: ${NEXT_PUBLIC_E2E_PROVIDER_MOCK:-0}
      NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK: ${NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK:-0}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/bn"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
