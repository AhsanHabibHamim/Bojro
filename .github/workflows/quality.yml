name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bojro_test
          POSTGRES_USER: bojro
          POSTGRES_PASSWORD: bojro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bojro -d bojro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://bojro:bojro_test@localhost:5432/bojro_test
      REDIS_URL: redis://localhost:6379/15
      CORS_ORIGINS: '["http://localhost:3000"]'
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          version: "0.13.4"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project backend --frozen --all-groups

      - name: Validate Compose configuration
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet

      - name: Apply and validate database seed
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed
          pnpm db:check

      - name: Verify generated API contract
        run: |
          pnpm api:generate
          git diff --exit-code -- backend/openapi.json frontend/src/lib/api/schema.d.ts
          test -z "$(git status --porcelain -- backend/openapi.json frontend/src/lib/api/schema.d.ts)"

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          mkdir -p coverage
          pnpm test
          uv run --project backend coverage xml --rcfile=backend/pyproject.toml -o coverage/backend.xml

      - name: Upload backend coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: |
            coverage/backend.xml
            .coverage
          if-no-files-found: warn
          retention-days: 30

      - name: Build
        run: pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEED_ADMIN_EMAIL: admin-e2e@bojro.com.bd
      SEED_ADMIN_PASSWORD: "E2E-only-admin-password-47!"
      E2E_ADMIN_EMAIL: admin-e2e@bojro.com.bd
      E2E_ADMIN_PASSWORD: "E2E-only-admin-password-47!"
      E2E_ADMIN_ORDER_NUMBER: BJ-2099-900002
      APP_ENV: test
      BKASH_MODE: mock
      NAGAD_MODE: mock
      SSLCOMMERZ_MODE: mock
      PATHAO_MODE: mock
      STEADFAST_MODE: mock
      REDX_MODE: mock
      COURIER_PROVIDER: mock
      EMAIL_PROVIDER: mock
      SMS_PROVIDER: mock
      META_CAPI_MODE: mock
      META_PIXEL_ID: "123456789012345"
      GOOGLE_ANALYTICS_ID: G-E2EBOJRO
      ASSISTANT_PROVIDER: mock
      ASSISTANT_PUBLIC_ENABLED: "true"
      WHATSAPP_ENABLED: "true"
      WHATSAPP_PHONE: "+8801700000000"
      PHASE6_E2E_RESET_TOKEN: local-phase6-e2e-reset-token
      PHASE7_E2E_ENABLED: "true"
      PHASE7_E2E_RESET_TOKEN: local-phase7-e2e-reset-token
      NEXT_PUBLIC_E2E_STORAGE_MOCK: "1"
      NEXT_PUBLIC_E2E_PROVIDER_MOCK: "1"
      NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install browser test dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @bojro/frontend exec playwright install --with-deps chromium

      - name: Build and start the full stack
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml up --build --wait

      - name: Smoke-test services
        run: |
          curl --fail --retry 5 --retry-all-errors http://localhost:8000/health
          curl --fail --retry 5 --retry-all-errors http://localhost:8000/ready
          curl --fail --retry 5 --retry-all-errors http://localhost:3000/bn
          curl --fail --retry 5 --retry-all-errors http://localhost:3000/en

      - name: Audit mobile performance
        continue-on-error: true
        run: |
          mkdir -p artifacts/lighthouse
          for attempt in 1 2 3; do
            pnpm dlx lighthouse@12.8.2 http://localhost:3000/bn --output=json --output-path="artifacts/lighthouse/bn-home-$attempt.json" --chrome-flags='--headless=new --no-sandbox --disable-gpu' --only-categories=performance,accessibility --form-factor=mobile --throttling.cpuSlowdownMultiplier=2 >/dev/null 2>&1
            pnpm dlx lighthouse@12.8.2 http://localhost:3000/bn/product/10000mah-fast-power-bank --output=json --output-path="artifacts/lighthouse/bn-product-$attempt.json" --chrome-flags='--headless=new --no-sandbox --disable-gpu' --only-categories=performance,accessibility --form-factor=mobile --throttling.cpuSlowdownMultiplier=2 >/dev/null 2>&1
            pnpm dlx lighthouse@12.8.2 http://localhost:3000/en --output=json --output-path="artifacts/lighthouse/en-home-$attempt.json" --chrome-flags='--headless=new --no-sandbox --disable-gpu' --only-categories=performance,accessibility --form-factor=mobile --throttling.cpuSlowdownMultiplier=2 >/dev/null 2>&1
            pnpm dlx lighthouse@12.8.2 http://localhost:3000/en/product/10000mah-fast-power-bank --output=json --output-path="artifacts/lighthouse/en-product-$attempt.json" --chrome-flags='--headless=new --no-sandbox --disable-gpu' --only-categories=performance,accessibility --form-factor=mobile --throttling.cpuSlowdownMultiplier=2 >/dev/null 2>&1
          done
          node scripts/check-lighthouse.mjs artifacts/lighthouse

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-mobile
          path: artifacts/lighthouse
          if-no-files-found: warn
          retention-days: 30

      - name: Run guest checkout and auth E2E
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          E2E_OTP_CODE: "123456"
          E2E_API_URL: http://localhost:8000
          E2E_ADMIN_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_ORDER_NUMBER: ${{ env.E2E_ADMIN_ORDER_NUMBER }}
          NEXT_PUBLIC_E2E_STORAGE_MOCK: "1"
          NEXT_PUBLIC_E2E_PROVIDER_MOCK: "1"
          NEXT_PUBLIC_E2E_ENGAGEMENT_MOCK: "1"
          NEXT_PUBLIC_E2E_SEED_RESET_URL: http://localhost:8000/api/v1/e2e/phase6/reset
          PHASE6_E2E_RESET_TOKEN: local-phase6-e2e-reset-token
          NEXT_PUBLIC_E2E_PHASE7_RESET_URL: http://localhost:8000/api/v1/e2e/phase7/reset
          PHASE7_E2E_RESET_TOKEN: local-phase7-e2e-reset-token
          E2E_REVALIDATION_SECRET: local-only-change-me-revalidation-secret
        run: pnpm --filter @bojro/frontend test:e2e

      - name: Run BN and EN accessibility smoke
        if: always()
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          A11Y_REPORT_PATH: artifacts/accessibility/playwright-a11y.json
        run: node scripts/accessibility-smoke.mjs

      - name: Upload Playwright and accessibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            artifacts/accessibility
          if-no-files-found: warn
          retention-days: 30

      - name: Print container logs on failure
        if: failure()
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml logs --no-color

      - name: Stop services
        if: always()
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml down --volumes
