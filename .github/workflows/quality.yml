name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bojro_test
          POSTGRES_USER: bojro
          POSTGRES_PASSWORD: bojro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bojro -d bojro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://bojro:bojro_test@localhost:5432/bojro_test
      REDIS_URL: redis://localhost:6379/15
      CORS_ORIGINS: '["http://localhost:3000"]'
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.23"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project backend --frozen --all-groups

      - name: Validate Compose configuration
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet

      - name: Apply and validate database seed
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed
          pnpm db:check

      - name: Verify generated API contract
        run: |
          pnpm api:generate
          git diff --exit-code -- backend/openapi.json frontend/src/lib/api/schema.d.ts
          test -z "$(git status --porcelain -- backend/openapi.json frontend/src/lib/api/schema.d.ts)"

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SEED_ADMIN_EMAIL: admin-e2e@bojro.com.bd
      SEED_ADMIN_PASSWORD: "E2E-only-admin-password-47!"
      E2E_ADMIN_EMAIL: admin-e2e@bojro.com.bd
      E2E_ADMIN_PASSWORD: "E2E-only-admin-password-47!"
      E2E_ADMIN_ORDER_NUMBER: BJ-2099-900002
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and start the full stack
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml up --build --wait

      - name: Smoke-test services
        run: |
          curl --fail --retry 5 --retry-all-errors http://localhost:8000/health
          curl --fail --retry 5 --retry-all-errors http://localhost:8000/ready
          curl --fail --retry 5 --retry-all-errors http://localhost:3000/bn
          curl --fail --retry 5 --retry-all-errors http://localhost:3000/en

      - name: Audit mobile performance
        run: |
          for attempt in 1 2; do
            pnpm dlx lighthouse@12.8.2 http://localhost:3000/en --output=json --output-path="home-lighthouse-$attempt.json" --chrome-flags='--headless=new --no-sandbox --disable-gpu' --only-categories=performance --form-factor=mobile --throttling.cpuSlowdownMultiplier=2 --quiet
            pnpm dlx lighthouse@12.8.2 http://localhost:3000/en/product/10000mah-fast-power-bank --output=json --output-path="product-lighthouse-$attempt.json" --chrome-flags='--headless=new --no-sandbox --disable-gpu' --only-categories=performance --form-factor=mobile --throttling.cpuSlowdownMultiplier=2 --quiet
          done
          node -e "for (const route of ['home','product']) { const scores=[1,2].map(run=>require('./'+route+'-lighthouse-'+run+'.json').categories.performance.score); const score=Math.max(...scores); if (score < 0.9) throw new Error(route+' performance scores '+scores.join(',')+' are below 0.9'); console.log(route, scores, 'accepted', score); }"

      - name: Install browser test dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run guest checkout and auth E2E
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          E2E_OTP_CODE: "123456"
          E2E_API_URL: http://localhost:8000
          E2E_ADMIN_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_ORDER_NUMBER: ${{ env.E2E_ADMIN_ORDER_NUMBER }}
          NEXT_PUBLIC_E2E_STORAGE_MOCK: "1"
          NEXT_PUBLIC_E2E_PROVIDER_MOCK: "1"
          NEXT_PUBLIC_E2E_SEED_RESET_URL: http://localhost:8000/api/v1/e2e/phase6/reset
          PHASE6_E2E_RESET_TOKEN: local-phase6-e2e-reset-token
        run: pnpm --filter @bojro/frontend test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Print container logs on failure
        if: failure()
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml logs --no-color

      - name: Stop services
        if: always()
        run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml down --volumes
